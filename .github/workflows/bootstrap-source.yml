name: Bootstrap ChainScope source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source archive
        run: |
          curl -fL --retry 3 https://chainscope-lab.shenxinyi-eunice.chatgpt.site/chainscope-source.zip -o /tmp/chainscope-source.zip
          echo "6e8737c729d5c00f018dabf0b5319b8305b5944ad6c8722457849462d8be7b89  /tmp/chainscope-source.zip" | sha256sum -c -
      - name: Publish source tree
        run: |
          mkdir -p /tmp/chainscope-source
          unzip -q /tmp/chainscope-source.zip -d /tmp/chainscope-source
          rm -f /tmp/chainscope-source/.github/workflows/sync-and-evaluate.yml
          cp -a /tmp/chainscope-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish ChainScope real RAG portfolio"
          git push
